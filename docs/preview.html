<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aperçu de Material-Thunderbird</title>
  <meta name="description" content="Aperçu interactif du thème Material-Thunderbird, avec les couleurs exactes de l'extension.">
  <link rel="icon" type="image/png" href="favicon-48.png">
  <!-- Les jetons de couleur de l'extension, copiés tels quels par scripts/build.ps1. -->
  <link rel="stylesheet" href="theme/tokens/shapes.css?v=1.7.2">
  <link rel="stylesheet" href="theme/tokens/colors-light.css?v=1.7.2">
  <link rel="stylesheet" href="theme/tokens/colors-dark.css?v=1.7.2">
  <link rel="stylesheet" href="theme/tokens/bridge.css?v=1.7.2">
  <script src="theme/icons.js?v=1.7.2"></script>
  <script src="theme/settings.js?v=1.7.2"></script>
  <script>
    // Avant le premier rendu : pas de flash de la mauvaise palette.
    MaterialSettings.apply(document, MaterialSettings.load());
  </script>
  <style>
    /* L'aperçu reproduit la disposition de Thunderbird 128 (Nebula) avec les
       jetons de chrome/tokens/ : seules les couleurs viennent de l'extension,
       la mise en page est réécrite en HTML. */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--md-sys-font-family);
      font-size: 13px;
      color: var(--md-sys-color-on-surface);
      background: var(--md-sys-color-surface-container-low);
      overflow: hidden;
    }
    button { font: inherit; color: inherit; }
    svg.i { width: 20px; height: 20px; fill: currentColor; flex: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    /* Icônes émojis : même principe que l'option de l'extension. */
    .ico { display: inline-flex; align-items: center; justify-content: center; }
    .mt-emojis .ico[data-emoji] svg { display: none; }
    .mt-emojis .ico[data-emoji]::after { content: attr(data-emoji); font-size: 16px; line-height: 1; }
    /* Icônes « Moderne » (thème par défaut de l'extension) : icônes Fluent
       arrondies, en contour, pleines pour l'élément actif ; teinte de l'accent
       rapprochée du gris des textes secondaires, comme iconColors(). */
    .mt-icons-modern .ico { color: color-mix(in srgb, var(--md-sys-color-primary) 55%, var(--md-sys-color-on-surface-variant)); }
    .active { --ico-o: none; --ico-f: inline; }

    .window { display: flex; height: 100%; }
    .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

    /* ---- Barre de recherche, puis onglets en pilules ---- */
    .tabs-bar {
      display: flex; align-items: center; gap: 4px;
      padding: 2px 10px 6px 10px;
      background: var(--md-sys-color-surface-container-low);
    }
    .tab {
      display: flex; align-items: center; gap: 8px;
      height: 32px; padding: 0 14px 0 12px; max-width: 220px;
      border-radius: var(--md-shape-corner-full);
      color: var(--md-sys-color-on-surface-variant); font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tab.active { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); font-weight: 600; }
    .tab svg.i { width: 16px; height: 16px; }

    .toolbar {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px 4px 10px;
      background: var(--md-sys-color-surface-container-low);
    }
    .search {
      flex: 1 1 auto; max-width: 560px; margin: 0 auto;
      display: flex; align-items: center; gap: 10px;
      height: 36px; padding: 0 16px;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
      border-radius: var(--md-shape-corner-full);
    }
    .search kbd { margin-left: auto; font: inherit; font-size: 11px; opacity: .7; }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border: none; background: transparent;
      border-radius: var(--md-shape-corner-full);
      color: var(--md-sys-color-on-surface-variant); cursor: pointer;
    }
    .icon-btn:hover { background: var(--md-sys-state-hover); color: var(--md-sys-color-on-surface); }

    /* ---- Corps ---- */
    .body { flex: 1 1 auto; display: flex; min-height: 0; }

    /* Barre des espaces (Navigation Rail) */
    .spaces {
      width: 56px; flex: none;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 8px 0;
      background: var(--spaces-bg-color, var(--md-sys-color-surface-container));
    }
    .space-btn {
      width: 40px; height: 32px; border: none; cursor: pointer;
      border-radius: var(--md-shape-corner-full);
      background: transparent; color: var(--md-sys-color-on-surface-variant);
      display: flex; align-items: center; justify-content: center;
    }
    .space-btn:hover { background: var(--md-sys-state-hover); }
    .space-btn.active { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
    .spaces .spacer { flex: 1; }

    /* Volet des dossiers */
    .folders {
      width: 252px; flex: none; overflow-y: auto;
      padding: 8px 8px 16px;
      background: var(--md-sys-color-surface-container-low);
    }
    .folder-header { display: flex; align-items: center; gap: 4px; margin-bottom: 10px; }
    .fab {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px;
      height: 36px; padding: 0 18px; border: none; cursor: pointer;
      border-radius: var(--md-shape-corner-full);
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      font-weight: 600; white-space: nowrap;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }
    .fab:hover { background: color-mix(in srgb, var(--md-sys-color-on-primary) 10%, var(--md-sys-color-primary)); }
    .fab svg.i { width: 18px; height: 18px; }
    .account {
      display: flex; align-items: center; gap: 8px;
      height: 36px; padding: 0 8px; margin-top: 6px;
      font-weight: 700; color: var(--md-sys-color-on-surface);
    }
    .account > svg.i { width: 16px; height: 16px; color: var(--md-sys-color-on-surface-variant); }
    .account .ico svg.i { width: 18px; height: 18px; }
    .account .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #folderList, #localFolders { padding-left: 14px; }
    .folder {
      display: flex; align-items: center; gap: 12px; width: 100%;
      height: 36px; padding: 0 12px; border: none; cursor: pointer; text-align: left;
      border-radius: var(--md-shape-corner-full);
      background: transparent; color: var(--md-sys-color-on-surface);
    }
    .folder:hover { background: var(--md-sys-state-hover); }
    .folder.active {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container); font-weight: 600;
    }
    .folder .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .folder .count {
      min-width: 22px; padding: 1px 7px; border-radius: var(--md-shape-corner-full);
      font-size: 11px; font-weight: 600; text-align: center;
      background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
    }
    .folder.active .count { background: transparent; color: inherit; }
    .folder svg.i { width: 18px; height: 18px; }

    /* Liste des messages */
    .threads {
      width: clamp(280px, 31vw, 380px); flex: none; display: flex; flex-direction: column; min-width: 0;
      background: var(--md-sys-color-surface-container-low);
      border-radius: var(--md-shape-corner-large) 0 0 0;
    }
    .threads-header {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 10px 8px 16px;
    }
    .threads-header h1 { font-size: 15px; font-weight: 600; margin: 0; }
    .threads-header h1, .threads-header .sub { white-space: nowrap; }
    .threads-header .sub { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .threads-header .sub { color: var(--md-sys-color-on-surface-variant); font-size: 12px; margin-left: 2px; }
    .threads-header .grow { flex: 1; }
    .chip-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px; border: none; cursor: pointer;
      border-radius: var(--md-shape-corner-full);
      background: transparent; color: var(--md-sys-color-on-surface-variant);
      font-size: 12px; font-weight: 500;
    }
    .chip-btn:hover { background: var(--md-sys-state-hover); color: var(--md-sys-color-on-surface); }
    .chip-btn svg.i { width: 16px; height: 16px; }
    .list { flex: 1; overflow-y: auto; padding: 0 8px 12px; display: flex; flex-direction: column; gap: 4px; }

    .card {
      display: flex; gap: 12px; width: 100%; text-align: left; cursor: pointer;
      padding: 10px 12px; border: 1px solid transparent;
      border-radius: var(--md-shape-corner-medium);
      background: var(--tree-card-background, var(--md-sys-color-surface-container-lowest));
      position: relative;
    }
    .card:hover { border-color: var(--tree-card-border-hover, var(--md-sys-color-outline-variant)); }
    .card.selected {
      background: var(--tree-card-background-selected, var(--md-sys-color-secondary-container));
      color: var(--md-sys-color-on-secondary-container);
    }
    .card .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .card .line { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .card .from { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .date { font-size: 11.5px; color: var(--md-sys-color-on-surface-variant); flex: none; }
    .card.selected .date { color: inherit; opacity: .8; }
    .card .subject { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--md-sys-color-on-surface-variant); }
    .card.selected .subject { color: inherit; }
    .card.unread .from, .card.unread .subject { font-weight: 700; color: inherit; }
    .card.unread::before {
      content: ""; position: absolute; left: 4px; top: 50%; width: 6px; height: 6px; margin-top: -3px;
      border-radius: 50%; background: var(--md-sys-color-primary);
    }
    .card .meta { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
    .twisty {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 9px; border: none; cursor: pointer;
      border-radius: var(--md-shape-corner-full);
      background: var(--md-sys-color-surface-container-low);
      color: var(--md-sys-color-on-surface-variant);
      font-size: 11px; font-weight: 600;
    }
    .card.selected .twisty { background: rgba(255, 255, 255, .5); color: inherit; }
    .twisty svg.i { width: 14px; height: 14px; transition: transform var(--md-motion-duration-short) var(--md-motion-easing-standard); }
    .twisty[aria-expanded="true"] svg.i { transform: rotate(180deg); }
    .twisty .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--md-sys-color-primary); }

    .card.child { margin-left: 22px; width: calc(100% - 22px); padding-top: 8px; padding-bottom: 8px; }
    .card.child.read { opacity: .72; }
    .card.child.read:hover, .card.child.read.selected { opacity: 1; }
    .reveal {
      margin-left: 22px; align-self: flex-start;
      padding: 4px 12px; border: 1px dashed var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-full); background: transparent; cursor: pointer;
      color: var(--md-sys-color-primary); font-size: 12px; font-weight: 600;
    }
    .reveal:hover { background: var(--md-sys-state-hover); }

    /* Avatars : initiale colorée, ou logo de la marque (BIMI). */
    .avatar {
      width: 36px; height: 36px; flex: none; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 15px; overflow: hidden;
    }
    .avatar.small { width: 28px; height: 28px; font-size: 12px; }
    .avatar img { width: 100%; height: 100%; display: block; }

    /* Volet de lecture */
    .reader {
      flex: 1 1 auto; min-width: 0; overflow-y: auto;
      background: var(--md-sys-color-surface-container-low);
      padding: 0 14px 20px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .reader .back, .phone-only { display: none; }
    .header-card {
      margin-top: 10px; padding: 16px 18px;
      background: var(--md-sys-color-surface-container-lowest);
      border-radius: var(--md-shape-corner-large);
      box-shadow: var(--md-sys-elevation-1);
    }
    /* Disposition à la Gmail, comme dans l'extension : sujet en titre, puis
       l'expéditeur avec les actions à droite, puis les destinataires. */
    .subject-line { font-size: 20px; font-weight: 500; margin: 0 0 12px; line-height: 1.35; }
    .header-top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
    .header-top .who { flex: 1 1 140px; min-width: 0; }
    .header-top .who b, .header-top .who span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-top .who span { color: var(--md-sys-color-on-surface-variant); font-size: 12px; }
    .header-to { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-left: 0; font-size: 12.5px; color: var(--md-sys-color-on-surface-variant); }
    .header-to b { color: var(--md-sys-color-on-surface); font-weight: 500; }
    .header-to .grow { flex: 1; }
    .header-to .avatar { width: 22px; height: 22px; font-size: 11px; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; max-width: 100%; }
    .hbtn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border: none; border-radius: 50%;
      background: transparent; color: var(--md-sys-color-on-surface-variant); cursor: pointer;
    }
    .hbtn:hover { background: var(--md-sys-state-hover); color: var(--md-sys-color-on-surface); }
    .hbtn svg.i, .pill.tonal svg.i { width: 18px; height: 18px; }
    .pill.tonal { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); border-color: transparent; font-weight: 600; height: 34px; padding: 0 16px 0 12px; margin-right: 6px; }
    .pill.tonal:hover { background: color-mix(in srgb, var(--md-sys-color-on-secondary-container) 8%, var(--md-sys-color-secondary-container)); }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-full);
      background: transparent; color: var(--md-sys-color-on-surface); cursor: pointer;
      font-size: 12.5px; font-weight: 500;
    }
    .pill:hover { background: var(--md-sys-state-hover); }
    .pill.primary { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); border-color: transparent; }
    .pill svg.i { width: 16px; height: 16px; }

    .body-card {
      padding: 18px 22px; line-height: 1.6;
      background: var(--md-sys-color-surface-container-lowest);
      border-radius: var(--md-shape-corner-large);
    }
    .body-card p { margin: 0 0 12px; }
    .body-card p:last-child { margin-bottom: 0; }
    .body-card ul { margin: 0 0 12px; padding-left: 20px; }
    .body-card .code {
      display: inline-block; margin: 4px 0 12px; padding: 10px 18px;
      border-radius: var(--md-shape-corner-medium);
      background: var(--md-sys-color-surface-container-high);
      font: 700 26px/1 var(--md-sys-font-family-mono); letter-spacing: 6px;
    }
    .body-card .footer { margin-top: 18px; font-size: 11.5px; color: var(--md-sys-color-on-surface-variant); }
    .body-card .footer a { color: inherit; }
    .body-card a { color: var(--md-sys-color-primary); }
    .hint {
      padding: 10px 14px; border-radius: var(--md-shape-corner-medium);
      background: var(--md-sys-color-surface-container-high);
      font-size: 12.5px; color: var(--md-sys-color-on-surface-variant);
    }

    /* Bandeau de désinscription : mêmes règles que message-header.css. */
    .unsub {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 18px;
      background: var(--md-sys-color-surface-container-lowest);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-medium);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .06), 0 1px 2px rgba(0, 0, 0, .04);
      animation: unsubIn 220ms var(--md-motion-easing-standard);
    }
    @keyframes unsubIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .unsub .left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .unsub .icon {
      width: 32px; height: 32px; flex: none; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container);
    }
    .unsub .icon svg.i { width: 18px; height: 18px; }
    .unsub .title { display: block; font-weight: 700; }
    .unsub .desc { display: block; font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
    .unsub .btns { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .unsub .btns:not(:has(> :nth-child(3))) { flex-wrap: nowrap; flex-shrink: 0; }
    .unsub .go {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: none; cursor: pointer;
      border-radius: var(--md-shape-corner-full);
      background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
      font-size: 12.5px; font-weight: 600; white-space: nowrap;
    }
    .unsub .go svg.i { width: 14px; height: 14px; }
    .unsub .text-btn {
      padding: 6px 12px; border: none; cursor: pointer; background: transparent;
      border-radius: var(--md-shape-corner-full);
      color: var(--md-sys-color-primary); font-size: 12.5px; font-weight: 600; white-space: nowrap;
    }
    .unsub .text-btn:hover { background: var(--md-sys-state-hover); }
    .unsub .text-btn.muted { color: var(--md-sys-color-on-surface-variant); }
    .unsub .close {
      width: 28px; height: 28px; border: none; cursor: pointer; background: transparent;
      border-radius: 50%; color: var(--md-sys-color-on-surface-variant);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .unsub .close:hover { background: var(--md-sys-state-hover); }
    .unsub .close svg.i { width: 16px; height: 16px; }
    .unsub.list {
      background: transparent; box-shadow: none; border-color: transparent;
      border-top: 1px solid var(--md-sys-color-outline-variant); border-radius: 0;
      padding: 4px 6px;
    }
    .unsub.list .icon { width: 24px; height: 24px; background: transparent; color: var(--md-sys-color-on-surface-variant); }
    .unsub.list .title { font-weight: 500; font-size: 12.5px; color: var(--md-sys-color-on-surface-variant); }
    .unsub.done .icon { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }

    /* Vue conversation (multimessage) */
    .conv-head {
      margin-top: 10px; padding: 16px 18px;
      background: var(--md-sys-color-surface-container-lowest);
      border-radius: var(--md-shape-corner-large); box-shadow: var(--md-sys-elevation-1);
    }
    .conv-head h2 { margin: 0 0 4px; font-size: 18px; }
    .conv-head .sub { color: var(--md-sys-color-on-surface-variant); font-size: 12.5px; margin-bottom: 10px; }
    .conv-card {
      display: flex; gap: 12px; padding: 14px 16px; text-align: left; border: none; cursor: pointer; width: 100%;
      background: var(--md-sys-color-surface-container-lowest);
      border-radius: var(--md-shape-corner-large);
    }
    .conv-card:hover { box-shadow: var(--md-sys-elevation-1); }
    .conv-card .main { flex: 1; min-width: 0; }
    .conv-card .line { display: flex; gap: 8px; align-items: baseline; }
    .conv-card .line b { flex: 1; }
    .conv-card .date { font-size: 11.5px; color: var(--md-sys-color-on-surface-variant); }
    .conv-card p { margin: 4px 0 0; color: var(--md-sys-color-on-surface-variant); }
    .conv-card.unread b { color: var(--md-sys-color-primary); }

    /* Fenêtre de personnalisation : reprise de celle de l'extension. */
    .backdrop {
      position: fixed; inset: 0; z-index: 10; display: none;
      align-items: center; justify-content: center; padding: 16px;
      background: rgba(0, 0, 0, .32);
    }
    .backdrop.open { display: flex; }
    .dialog {
      width: 420px; max-width: 100%; max-height: 100%; overflow-y: auto;
      padding: 22px 22px 16px; display: flex; flex-direction: column; gap: 16px;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      border-radius: var(--md-shape-corner-extra-large); box-shadow: var(--md-sys-elevation-3);
    }
    .dialog h2 { margin: 0; font-size: 20px; font-weight: 500; }
    .dialog .dsub { font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
    .dialog-head { display: flex; align-items: flex-start; justify-content: space-between; }
    .section-title { font-size: 12px; font-weight: 600; color: var(--md-sys-color-on-surface-variant); margin-bottom: 8px; }
    .segmented { display: flex; border: 1px solid var(--md-sys-color-outline); border-radius: var(--md-shape-corner-full); overflow: hidden; }
    .segmented button {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 6px; border: none; cursor: pointer; background: transparent; font-weight: 500;
    }
    .segmented button + button { border-left: 1px solid var(--md-sys-color-outline); }
    .segmented button[aria-pressed="true"] { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
    .segmented svg.i { width: 16px; height: 16px; display: none; }
    .segmented button[aria-pressed="true"] svg.i { display: block; }
    .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .swatch {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 10px 4px; border: 1px solid transparent; cursor: pointer; background: transparent;
      border-radius: var(--md-shape-corner-large); font-size: 12px;
    }

    .swatch[aria-pressed="true"] { border-color: var(--md-sys-color-outline-variant); background: var(--md-sys-color-surface-container-low); font-weight: 600; }
    .swatch .dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; }
    .swatch .dot svg.i { width: 18px; height: 18px; visibility: hidden; }
    .swatch[aria-pressed="true"] .dot svg.i { visibility: visible; }
    .option {
      display: flex; align-items: center; gap: 16px; cursor: pointer;
      padding: 12px 16px; border-radius: var(--md-shape-corner-large);
      background: var(--md-sys-color-surface-container-low);
    }
    .option + .option { margin-top: 6px; }
    .option .info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .option .t { font-weight: 500; }
    .option .d { font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
    .switch { position: relative; width: 52px; height: 32px; flex: none; }
    .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .switch .track {
      position: absolute; inset: 0; border-radius: 16px; pointer-events: none;
      border: 2px solid var(--md-sys-color-outline); background: var(--md-sys-color-surface-container-highest);
      transition: background var(--md-motion-duration-short);
    }
    .switch .track::after {
      content: ""; position: absolute; top: 6px; left: 6px; width: 16px; height: 16px; border-radius: 50%;
      background: var(--md-sys-color-outline);
      transition: all var(--md-motion-duration-short) var(--md-motion-easing-standard);
    }
    .switch input:checked + .track { background: var(--md-sys-color-primary); border-color: var(--md-sys-color-primary); }
    .switch input:checked + .track::after { left: 22px; top: 2px; width: 24px; height: 24px; background: var(--md-sys-color-on-primary); }
    .switch input:focus-visible + .track { outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px; }

      { id: "forge", from: "Forge logicielle", email: "notifications@forge.example",

        body: "<p>Une nouvelle personne a ajouté une étoile à <b>Material-Thunderbird</b>. Ça fait toujours plaisir.</p>" }
    ];

    var FOLDERS = [
      { name: "Boîte de réception", icon: "inbox", emoji: "📥", count: 0, active: true },
      { name: "Brouillons", icon: "drafts", emoji: "📝" },
      { name: "Envoyés", icon: "send", emoji: "📤" },
      { name: "Archives", icon: "archive", emoji: "🗄️" },
      { name: "Indésirables", icon: "junk", emoji: "🚫" },
      { name: "Corbeille", icon: "delete", emoji: "🗑️" }
    ];
    var LOCAL = [
      { name: "Thèse — version finale (v12)", icon: "folder", emoji: "📁" },
      { name: "Recettes de grand-mère", icon: "folder", emoji: "📁" }
    ];

    var state = { selected: "welcome", expanded: { meeting: true }, showRead: {}, ignored: {}, hidden: {}, banner: {} };

    function unreadCount() {
      var n = 0;
      MESSAGES.forEach(function (m) {
        if (m.unread) n++;
        (m.replies || []).forEach(function (r) { if (r.unread) n++; });
      });
      return n;
    }

    function renderFolders() {
      FOLDERS[0].count = unreadCount();
      function row(f) {
        return '<button class="folder' + (f.active ? " active" : "") + '">' +
          '<span class="ico" data-emoji="' + f.emoji + '">' + icon(f.icon) + "</span>" +
          '<span class="name">' + esc(f.name) + "</span>" +
          (f.count ? '<span class="count">' + f.count + "</span>" : "") + "</button>";
      }
      document.getElementById("folderList").innerHTML = FOLDERS.map(row).join("");
      document.getElementById("localFolders").innerHTML = LOCAL.map(row).join("");
      document.getElementById("countLabel").textContent = "· " + unreadCount() + " non lus";
    }

    function findMessage(id) {
      for (var i = 0; i < MESSAGES.length; i++) {
        if (MESSAGES[i].id === id) return { msg: MESSAGES[i], parent: null };
        var replies = MESSAGES[i].replies || [];
        for (var j = 0; j < replies.length; j++) {
          if (replies[j].id === id) return { msg: replies[j], parent: MESSAGES[i] };
        }
      }
      return null;
    }

    function renderList() {
      var html = "";
      MESSAGES.forEach(function (m) {
        var replies = m.replies || [];
        var unreadReplies = replies.filter(function (r) { return r.unread; }).length;
        html += '<button class="card' + (m.unread ? " unread" : "") + (state.selected === m.id ? " selected" : "") +
          '" data-id="' + m.id + '" role="option" aria-selected="' + (state.selected === m.id) + '">' +
          avatar(m) + '<span class="main"><span class="line"><span class="from">' + esc(m.from) +
          '</span><span class="date">' + esc(m.date) + '</span></span><span class="subject">' + esc(m.subject) + "</span>";
        if (replies.length) {
          var open = !!state.expanded[m.id];
          html += '<span class="meta"><span class="twisty" data-toggle="' + m.id + '" aria-expanded="' + open + '">' +
            icon("expand") + replies.length + " réponses" + (unreadReplies ? '<span class="dot" title="Réponses non lues"></span>' : "") +
            "</span></span>";
        }
        html += "</span></button>";
        if (replies.length && state.expanded[m.id]) {
          var hideRead = settings.hideRead && unreadReplies > 0 && !state.showRead[m.id];
          var hiddenCount = 0;
          replies.forEach(function (r) {
            if (hideRead && !r.unread) { hiddenCount++; return; }
            html += '<button class="card child' + (r.unread ? " unread" : " read") + (state.selected === r.id ? " selected" : "") +
              '" data-id="' + r.id + '" role="option" aria-selected="' + (state.selected === r.id) + '">' +
              avatar(r, true) + '<span class="main"><span class="line"><span class="from">' + esc(r.from) +
              '</span><span class="date">' + esc(r.date) + '</span></span><span class="subject">' + esc(r.text) + "</span></span></button>";
          });
          if (hiddenCount) {
            html += '<button class="reveal" data-reveal="' + m.id + '">Afficher ' + hiddenCount +
              (hiddenCount > 1 ? " réponses déjà lues" : " réponse déjà lue") + "</button>";
          }
        }
      });
      document.getElementById("list").innerHTML = html;
    }

    // ---- Bandeau de désinscription (simulé : rien ne part d'ici) ---------
    function bannerHtml(m) {
      var u = m.unsub;
      if (!u || !settings.unsub || state.ignored[m.id] || state.hidden[m.id]) return "";
      var step = state.banner[m.id] || "initial";
      var isList = u.kind === "list";
      var who = isList ? "la liste " + u.listName : m.from;
      var title, desc = "", btns = "", ico = isList ? "group" : "mail";
      var close = '<button class="close" data-unsub="dismiss" title="Masquer" aria-label="Masquer">' + icon("close") + "</button>";
      if (step === "initial") {
        if (isList) { title = "Liste de diffusion · " + u.listName; btns = '<button class="text-btn" data-unsub="go" title="Préparer le courriel de désinscription (rien n\'est envoyé sans vous)">Quitter la liste</button>' + close; }
        else {
          title = "Infolettre";
          desc = m.from + (u.oneClick ? " permet la désinscription en un clic." : " propose un lien de désinscription.");
          btns = '<button class="go" data-unsub="go" title="' + (u.oneClick ? "Désinscription immédiate, sans ouvrir de page" : "Ouvrir " + u.host) + '">' +
            (u.oneClick ? "" : icon("open")) + "Se désinscrire</button>" + close;
        }
      } else if (step === "confirm") {
        title = "Se désinscrire de " + m.from + " ?"; desc = "La demande part directement à " + u.host + ".";
        btns = '<button class="text-btn" data-unsub="back">Annuler</button><button class="go" data-unsub="send">Confirmer</button>';
      } else if (step === "opened") {
        title = isList ? "Courriel de désinscription préparé" : "Page ouverte dans un nouvel onglet";
        desc = isList ? "Relisez-le puis envoyez-le. Rien ne part sans vous." : "Une fois désinscrit, confirmez-le ici.";
        btns = '<button class="text-btn" data-unsub="later">Plus tard</button><button class="go" data-unsub="done">' + icon("check") + "C'est fait</button>";
      } else if (step === "sent" || step === "noted") {
        ico = "check";
        title = step === "sent" ? "Désinscription envoyée" : "Désinscription notée";
        desc = step === "sent" ? u.host + " a accepté la demande. Les prochains envois peuvent mettre quelques jours à s'arrêter."
                               : "Le bandeau ne sera plus proposé pour " + who + ".";
        btns = '<button class="text-btn" data-unsub="close">Fermer</button>';
      } else if (step === "dismiss") {
        title = "Masquer ce bandeau ?";
        btns = '<button class="text-btn" data-unsub="hide">Pour ce message</button>' +
          '<button class="text-btn" data-unsub="ignore">' + (isList ? "Pour cette liste" : "Pour cet expéditeur") + '</button><button class="text-btn muted" data-unsub="back">Annuler</button>';
      }
      var done = step === "sent" || step === "noted";
      return '<div class="unsub' + (isList ? " list" : "") + (done ? " done" : "") + '" role="status">' +
        '<div class="left"><span class="icon">' + icon(ico) + '</span><span><span class="title">' + esc(title) + "</span>" +
        (desc ? '<span class="desc">' + esc(desc) + "</span>" : "") + "</span></div>" +
        '<div class="btns">' + btns + "</div></div>";
    }

    function onBanner(action, m) {
      var u = m.unsub;
      var next = {
        go: u.kind === "newsletter" && u.oneClick ? "confirm" : "opened",
        send: "sent", back: "initial", done: "noted", dismiss: "dismiss"
      }[action];
      if (action === "hide") { state.hidden[m.id] = true; }
      else if (action === "ignore") { state.ignored[m.id] = true; }
      else if (action === "later" || action === "close") { state.hidden[m.id] = true; }
      else if (next) { state.banner[m.id] = next; }
      renderReader();
    }

    function hbtn(id, emoji, title) {
      return '<button class="hbtn" title="' + title + '" aria-label="' + title + '"><span class="ico" data-emoji="' + emoji + '">' + icon(id) + "</span></button>";
    }

    function headerHtml(m, subject) {
      return '<div class="header-card">' +
        '<div class="subject-line">' + esc(subject) + "</div>" +
        '<div class="header-top">' + avatar(m) +
        '<div class="who"><b>' + esc(m.from) + "</b><span>" + esc(m.email) + "</span></div>" +
        '<div class="actions"><button class="pill tonal"><span class="ico" data-emoji="↩️">' + icon("reply") + "</span>Répondre</button>" +
        hbtn("forward", "➡️", "Transférer") + hbtn("archive", "🗃️", "Archiver") +
        hbtn("junk", "🚫", "Indésirable") + hbtn("delete", "🗑️", "Supprimer") +
        '<button class="hbtn" title="Autres actions" aria-label="Autres actions">' + icon("more") + "</button>" +
        '<button class="hbtn" title="Suivi" aria-label="Suivi">' + icon("star") + "</button></div></div>" +
        '<div class="header-to"><span>Pour</span>' + avatar({ from: "Camille", email: "camille@exemple.fr" }, true) + "<b>Camille</b>" +
        '<span class="grow"></span><span>' + esc(m.date) + "</span></div></div>";
    }

    function renderReader() {
      var reader = document.getElementById("reader");
      var found = findMessage(state.selected);
      var back = '<button class="pill back" data-back="1">' + icon("back") + "Messages</button>";
      if (!found) { reader.innerHTML = ""; return; }
      var m = found.msg;
      if (m.replies) {
        // Le parent d'un fil ouvre la vue conversation.
        var all = [m].concat(m.replies);
        reader.innerHTML = back + '<div class="conv-head"><h2>' + esc(m.subject) + '</h2><div class="sub">' +
          all.length + " messages dans la conversation</div>" +
          '<div class="actions"><button class="pill primary">' + icon("archive") + "Archiver</button>" +
          '<button class="pill">' + icon("delete") + "Supprimer</button></div></div>" +
          all.map(function (r) {
            return '<button class="conv-card' + (r.unread ? " unread" : "") + '" data-open="' + r.id + '">' + avatar(r) +
              '<span class="main"><span class="line"><b>' + esc(r.from) + '</b><span class="date">' + esc(r.date) +
              "</span></span><p>" + esc(r.text || "Je propose qu'on fasse un point pour préparer le point de la semaine prochaine.") + "</p></span></button>";
          }).join("");
        return;
      }
      if (found.parent) {
        reader.innerHTML = back + headerHtml(m, "Re: " + found.parent.subject) +
          '<div class="body-card"><p>' + esc(m.text) + "</p></div>";
        return;
      }
      reader.innerHTML = back + headerHtml(m, m.subject) + bannerHtml(m) + '<div class="body-card">' + m.body + "</div>";
    }

    function select(id) {
      state.selected = id;
      var found = findMessage(id);
      if (found) found.msg.unread = false;
      document.getElementById("window").classList.add("reading");
      renderFolders();
      renderList();
      renderReader();
    }

    // ---- Interactions --------------------------------------------------
    document.getElementById("list").addEventListener("click", function (e) {
      var toggle = e.target.closest("[data-toggle]");
      if (toggle) {
        e.stopPropagation();
        var id = toggle.getAttribute("data-toggle");
        state.expanded[id] = !state.expanded[id];
        renderList();
        return;
      }
      var reveal = e.target.closest("[data-reveal]");
      if (reveal) { state.showRead[reveal.getAttribute("data-reveal")] = true; renderList(); return; }
      var card = e.target.closest("[data-id]");
      if (card) select(card.getAttribute("data-id"));
    });

    document.getElementById("reader").addEventListener("click", function (e) {
      if (e.target.closest("[data-back]")) { document.getElementById("window").classList.remove("reading"); return; }
      var open = e.target.closest("[data-open]");
      if (open) { select(open.getAttribute("data-open")); return; }
      var action = e.target.closest("[data-unsub]");
      if (action) {
        var found = findMessage(state.selected);
        if (found) onBanner(action.getAttribute("data-unsub"), found.msg);
      }
      if (e.target.closest("a[href='#']")) e.preventDefault();
    });

    // ---- Personnalisation ----------------------------------------------
    var MODES = [["light", "Clair"], ["dark", "Sombre"], ["auto", "Système"]];
    var ICON_LABELS = [["modern", "Moderne"], ["emoji", "Émojis"], ["default", "Thunderbird"]];
    function renderCustomizer() {
      document.getElementById("modeGroup").innerHTML = MODES.map(function (m) {
        return '<button data-mode="' + m[0] + '" aria-pressed="' + (settings.mode === m[0]) + '">' + icon("check") + m[1] + "</button>";
      }).join("");
      document.getElementById("paletteGroup").innerHTML = Object.keys(S.PALETTES).map(function (key) {
        var p = S.PALETTES[key];
        return '<button class="swatch" data-pal="' + key + '" aria-pressed="' + (settings.palette === key) + '">' +
          '<span class="dot" style="background:' + p.color + '">' + icon("check") + "</span>" + esc(p.name) + "</button>";
      }).join("");
      document.getElementById("iconsGroup").innerHTML = ICON_LABELS.map(function (t) {
        return '<button data-icons="' + t[0] + '" aria-pressed="' + (settings.icons === t[0]) + '">' + icon("check") + t[1] + "</button>";
      }).join("");
      Array.prototype.forEach.call(document.querySelectorAll("[data-setting]"), function (input) {
        input.checked = !!settings[input.getAttribute("data-setting")];
      });
    }

    function update(next, fromParent) {
      settings = S.sanitize(Object.assign({}, settings, next));
      S.save(settings);
      S.apply(document, settings);
      renderCustomizer();
      renderList();
      renderReader();
      if (embedded && !fromParent) {
        try { window.parent.postMessage({ source: "mt-preview", action: "settings", settings: settings }, location.origin); } catch (e) {}
      }
    }

    document.getElementById("modeGroup").addEventListener("click", function (e) {
      var b = e.target.closest("[data-mode]"); if (b) update({ mode: b.getAttribute("data-mode") });
    });
    document.getElementById("iconsGroup").addEventListener("click", function (e) {
      var b = e.target.closest("[data-icons]"); if (b) update({ icons: b.getAttribute("data-icons") });
    });
    document.getElementById("paletteGroup").addEventListener("click", function (e) {
      var b = e.target.closest("[data-pal]"); if (b) update({ palette: b.getAttribute("data-pal") });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-setting]"), function (input) {
      input.addEventListener("change", function () {
        var next = {}; next[input.getAttribute("data-setting")] = input.checked; update(next);
      });
    });

    var backdrop = document.getElementById("backdrop");
    var opener = document.getElementById("openCustomizer");
    function openCustomizer() { renderCustomizer(); backdrop.classList.add("open"); document.getElementById("closeCustomizer").focus(); }
    function closeCustomizer() { backdrop.classList.remove("open"); opener.focus(); }
    opener.addEventListener("click", openCustomizer);
    document.getElementById("openCustomizerPhone").addEventListener("click", openCustomizer);
    document.getElementById("closeCustomizer").addEventListener("click", closeCustomizer);
    document.getElementById("doneCustomizer").addEventListener("click", closeCustomizer);
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeCustomizer(); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && backdrop.classList.contains("open")) closeCustomizer();
      if (e.altKey && (e.key === "m" || e.key === "M")) { e.preventDefault(); openCustomizer(); }
    });

    // Réglages venus de la page d'accueil (bouton palette du site).
    window.addEventListener("message", function (e) {
      if (e.origin !== location.origin || !e.data || e.data.source !== "mt-site") return;
      if (e.data.action === "settings") update(e.data.settings, true);
      if (e.data.action === "openCustomizer") openCustomizer();
    });
    S.watchSystem(function () { if (settings.mode === "auto") S.apply(document, settings); });

    S.apply(document, settings); // le sprite des icônes existe maintenant
    renderFolders();
    renderList();
    renderReader();
    renderCustomizer();
    if (embedded) {
      try { window.parent.postMessage({ source: "mt-preview", action: "ready" }, location.origin); } catch (e) {}
