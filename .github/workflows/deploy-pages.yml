name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions nécessaires pour déployer sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permet un seul déploiement simultané pour éviter les conflits
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Exécution des tests de validation
        run: npm test

      # Deux canaux, un seul identifiant d'extension :
      # - stable : addons.thunderbird.net, publié à la main (dist/material-thunderbird-atn.xpi) ;
      # - expérimental : ce site, reconstruit à chaque push sur main.
      # La version expérimentale ajoute le numéro de build à celle du manifeste
      # (1.8.1 -> 1.8.1.57) : elle reste au-dessus de la stable du même numéro, et
      # la stable suivante (1.8.2) se retrouve aussitôt dépassée par 1.8.2.58.
      - name: Préparation du .xpi expérimental pour le site
        run: |
          mkdir -p docs/dist build
          cp -r extension build/extension
          # Vue Discussions : memes jetons de couleur que le theme (copies par
          # scripts/build.ps1 en local, ignores par git), et pas les fichiers
          # de la maquette.
          mkdir -p build/extension/chat/tokens
          cp chrome/tokens/*.css build/extension/chat/tokens/
          rm -f build/extension/chat/mock-data.js build/extension/chat/README.md
          node -e "
            const fs = require('fs');
            const file = 'build/extension/manifest.json';
            const m = JSON.parse(fs.readFileSync(file, 'utf8'));
            m.version = m.version + '.' + process.env.GITHUB_RUN_NUMBER;
            m.name = m.name + ' (expérimental)';
            fs.writeFileSync(file, JSON.stringify(m, null, 2) + '\n');
            console.log(m.name, m.version);
          "
          cd build/extension
          zip -r ../../docs/dist/material-thunderbird.xpi . -x "*.DS_Store"

      # Thunderbird lit updates.json (update_url du manifeste) une fois par jour
      # et installe seul toute version plus récente. Le lien pointe vers une
      # copie versionnée du .xpi, et l'empreinte permet à Thunderbird de vérifier
      # le fichier téléchargé.
      - name: Manifeste de mise à jour (updates.json)
        run: |
          VERSION=$(node -p "require('./build/extension/manifest.json').version")
          cp docs/dist/material-thunderbird.xpi "docs/dist/material-thunderbird-$VERSION.xpi"
          HASH=$(sha256sum "docs/dist/material-thunderbird-$VERSION.xpi" | cut -d' ' -f1)
          node -e "
            const m = require('./build/extension/manifest.json');
            // Le manifeste dit browser_specific_settings ; updates.json garde
            // la cle applications, celle de son propre format.
            const gecko = (m.browser_specific_settings || m.applications).gecko;
            const id = gecko.id;
            const out = { addons: { [id]: { updates: [{
              version: m.version,
              update_link: 'https://vforiel.github.io/Material-Thunderbird/dist/material-thunderbird-' + m.version + '.xpi',
              update_hash: 'sha256:$HASH',
              applications: { gecko: { strict_min_version: gecko.strict_min_version } }
            }] } } };
            require('fs').writeFileSync('docs/updates.json', JSON.stringify(out, null, 2) + '\n');
          "
          cat docs/updates.json

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléversement de l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

