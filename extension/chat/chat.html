<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discussions</title>
  <!-- Jetons du theme, copies depuis chrome/tokens/ par scripts/build.ps1. -->
  <link rel="stylesheet" href="tokens/shapes.css">
  <link rel="stylesheet" href="tokens/colors-light.css">
  <link rel="stylesheet" href="tokens/colors-dark.css">
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="side" aria-label="Conversations">
      <header class="side-head">
        <h1>Discussions</h1>
        <button class="icon-btn" id="theme-btn" title="Clair / sombre"><svg><use href="#i-theme"/></svg></button>
        <button class="icon-btn" id="sources-btn" title="Comptes et dossiers affichés"><svg><use href="#i-settings"/></svg></button>
      </header>
      <label class="search">
        <svg><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Rechercher une personne ou un message">
      </label>
      <div class="chips" id="filters" role="tablist">
        <button class="chip" data-filter="all" aria-selected="true">Tout</button>
        <button class="chip" data-filter="direct">Personnes</button>
        <button class="chip" data-filter="group">Groupes</button>
        <button class="chip" data-filter="list">Listes</button>
        <button class="chip" data-filter="newsletter">Infolettres</button>
      </div>
      <ul class="conv-list" id="conv-list"></ul>
      <p class="sources-line" id="sources-line"></p>
    </aside>

    <main class="thread" id="thread" aria-live="polite">
      <div class="empty">Choisissez une conversation</div>
    </main>

    <aside class="info" id="info" hidden></aside>
  </div>

  <dialog id="sources-dialog">
    <form method="dialog">
      <h2>Ce que la vue affiche</h2>
      <p class="hint">Les messages envoyés sont nécessaires pour voir vos propres bulles. Toutes les adresses des comptes cochés comptent comme « vous ».</p>
      <div id="sources-form"></div>
      <label class="stack">Mes autres adresses <small>(anciennes, alias ; une par ligne)</small>
        <textarea id="opt-me" rows="2" spellcheck="false"></textarea>
      </label>
      <label class="row"><input type="checkbox" id="opt-news" checked> Montrer les infolettres (en lecture seule)</label>
      <label class="row"><input type="checkbox" id="opt-read" checked> Ouvrir une conversation marque ses messages comme lus</label>
      <label class="row">Période
        <select id="opt-period">
          <option value="90">3 derniers mois</option>
          <option value="180" selected>6 derniers mois</option>
          <option value="365">1 an</option>
          <option value="0">Tout</option>
        </select>
      </label>
      <div class="dialog-actions">
        <button value="cancel" class="btn text">Annuler</button>
        <button value="ok" class="btn filled" id="sources-ok">Appliquer</button>
      </div>
    </form>
  </dialog>

  <script src="../shared/unsubscribe-rules.js"></script>

</body>
</html>
